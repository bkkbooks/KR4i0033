body:
  text: 誠齋詩話詩文評類提要臣等謹案誠齋詩話一卷宋楊萬里撰萬里有誠齋易傳已著録此編題曰詩話而論文之語乃多於詩又頗及諧謔雜事蓋宋人所著往往如斯不但萬里也萬里本以詩名故所論往往中理而其為詩好用文句及俚語故以李師中之山如仁者夀水似聖之清為善用經以蘇軾之避謗詩尋醫畏病酒入務僧顯萬之探支春色墻頭朵闌入風光竹外梢為善用字與自稱其立岸風大壯還舟燈小明以詩篇名對易卦者均非定論又李商隱夜半宴歸宫漏永薛王沉醉夀王醒暴揚國惡至為無禮萬里以為微婉顯晦盡而不朽尤宋人作詩好為訐激之習氣矣至於萬里時代距南渡初不逺乃以隆祐太后布告中外手詔為勸進髙宗手書於考論典故亦為紕謬殆所謂瑕瑜不掩利鈍互陳者歟全書已編入誠齋集中此乃别行之本今亦别著於録焉乾隆四十六年十二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:4f6e8b5ac64a3604f42b6239e6213a29c8c7768ad77271d53a0a67b9bc440809
