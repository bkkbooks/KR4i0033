body:
  text: 誠齊詩話宋楊萬里撰句有偶似古人者亦有述之者杜子美武侯廟詩云映階碧草自春色隔葉黃鸝空好音此何遜行孫氏陵云山鶯空樹響壠月自秋輝也杜云薄雲岩際宿孤月浪中翻此廋信白雲岩際出清月波中上也出上二字勝矣隂鏗云鶯隨入戶樹花逐下山風杜云月明垂葉露雲逐渡溪風又云水流行地日江入度山雲此一聨勝庾信云永韜三尺劍長捲一戎衣杜云風塵三尺劍社稷一戎衣亦勝廋矣南朝蘇子卿梅詩云祇言花是雪不悟有香來介甫云遙知不是雪為有暗香來述者不及作者陸龜䝉云殷勤與解丁香結從放繁枝散誕春介甫云殷勤為解丁香結放出枝頭自在春作者不及述者山谷集中有絶句云草色青青栁色黃桃花零落杏花香春風不解吹愁却春日偏能惹恨長此唐人賈至詩也特改五字耳賈云桃花歷亂李花香又東風不為吹愁去東坡云春宵一刻直千金花有清香月有隂歌管樓臺聲細細鞦韆院落夜沉沉介甫云金爐香燼漏聲殘剪翦輕風陳陳寒春色惱人眠不得月移花影上欄杆二詩流麗相似然亦有甲乙問余何事栖碧山笑而不答心自閒桃花流水窅然去别有天地非人間相隨遙遙訪赤城三十六曲水回縈一溪初入千花明萬􅊤度盡松風聲此李太白詩體也麒麟圖畫鴻雁行紫極出入黃金印又白摧朽骨龍虎死黑入太隂雷雨垂又指揮能事回天地訓練强兵動鬼神又路經灔澦雙蓬鬢天入滄浪一釣舟此杜子美詩體也明月易低人易散歸人呼酒更愁看又當其下筆風雨快筆所未到氣已吞又醉中不覺度千山夜聞梅香失醉眠又李白畫像西望太極橫峩岷眼髙四海空無人大兒汾陽中令君小兒天台坐忘身平生不識髙將軍手涴吾足乃敢嗔此東坡詩體也風光錯綜天經緯草木文章帝機杼又㵎松無心古鬢鬛天球不琢中粹溫又兒呼不蘇驢溼腳猶恐醒來有新作此山谷體也山谷詩去杜蘇逺矣金針法云八句律詩落句要如髙山轉石一去不回余以為不然詩已盡而味方永乃善之善也子美重陽詩云明年此㑹知誰健醉把茱萸仔細看夏日李尚書期不至云不是尚書期不至山隂夜雪興難乘詩有一句七言而三意者杜云對食暫餐還不能退之云欲去未到先思回有一句五言而兩意者陳後山更盡可無醉猶寒已自和詩有句中無其辭而句外有其意者巷伯之詩蘇氏刺暴公之譛已而曰二人同行誰為此禍杜云遣人向市賒香粳喚婦出房親自饌上言其力窮故曰賒下言其無使令故曰親又東歸貧路自覺難欲别上馬身無力上有相干之意而不言下有戀别之意而不忍又朋酒日歡㑹老夫今始知嘲其獨遺己而不招也又夏日不赴而云夜雪興難乘此不言熱而言寒反之也唐人葛溪漫淬干將劍却是猿聲斷客腸又釣臺如今亦有垂綸者自是江魚賣得錢唐人長門怨錯把黃金買詞賦相如自是薄情人崔道融如今却羡相如富猶有人間四壁居詩人驚人句杜山水障堂上不合生楓樹怪底江山起烟霧又斫却月中桂清光應更多白樂天云遙憐天上桂華孤為問姮娥更有無月中幸有閒田地何不中央種兩株韓子蒼衡嶽圖故人來自天柱峰手提石廩與祝融兩山陂陀幾百里安得置之行李中此亦是用東坡法云我持此石歸䄂中有東海杜牧云我欲東召龍伯公上天揭取北斗柄蓬萊頂上斡海水水盡見底看海空李賀云女媧煉石補天處石破天驚逗秋雨褒頌功德五言長韻律詩最要典雅重大如杜云鳳歷軒轅紀龍飛四十春八荒開壽域一氣轉洪鈞又云碧瓦初寒外金莖一氣旁山河持繡户日月近雕梁李義山云帝作黃金闕天開白玉京有人扶太極是夕降元精七言褒頌功德如少陵賈至諸人唱和早朝大明宫乃為典雅重大和此詩者岑參云花迎劍佩星初落栁拂旌旗露未乾最佳七言長韻古詩如杜少陵丹青引曹將軍畫馬奉先縣劉少府山水障歌等篇皆雄偉宏放不可捕捉學詩者於李杜蘇黃詩中求此等類誦讀沉酣深得其意味則落筆自絶矣大史公曰國風好色而不淫小雅怨誹而不亂左氏傳曰春秋之稱微而顯志而晦婉而成章盡而不汙此詩與春秋紀事之妙也近世詞人閒情之靡如伯有所賦趙武所不得聞者有過之無不及焉是得為好色而不淫乎惟晏叔原云落花人獨立微雨燕雙飛可為好色而不淫矣唐人長門怨云珊瑚枕上千行淚不是思君是恨君是得為怨誹而不亂乎惟劉長卿云月來深殿早春到後宫遲可謂怨誹而不亂矣近世陳克詠李伯時畫寧王進史圖云汗簡不知天上事至尊新納壽王妃是得為微為晦為婉為不汙穢乎惟李義山云侍燕歸來宫漏永薛王沉醉壽王醒可謂微婉顯晦盡而不汙矣士大夫間有口傳一兩聨可喜而莫知所本者如人情似紙畨畨薄世事如棋局局新又飽諳世事慵開眼㑹盡人情只㸃頭又薄有田園歸去好苦無官况莫來休又賀人休官重碧杯中天更大軟紅塵裏夢初收竟不知何人詩也又有嘲巧宦而事反拙者當初只為將勤補到底翻為弄巧成此尤可笑唐律七言八句一篇之中句句皆竒一句之中字字皆竒古今作者皆難之余嘗與林謙之論此事謙之慨然曰但吾輩詩集中不可不作數篇耳如杜九日詩老去悲秋强自寬興來今日盡君歡不徒八句便字字對屬又第一句頃刻變化才說悲秋忽又自寬以自對君自者我也又羞將短髮還吹帽笑倩旁人為正冠將一事翻騰作一聨又孟嘉以落帽為風流少陵以不落帽為風流翻盡古人公案最為妙法藍水逺從千澗落玉山髙並兩峰寒詩人至此筆力多衰今方且雄傑挺拔喚起一篇精神非筆力拔山不至於此明年此㑹知誰健醉把茱萸仔細看則意味深長幽然無窮矣東坡煎茶詩云活水還將活火烹自臨釣石汲深清第二句七字而具五意水清一也深處清者二也石下之水非有泥土三也石乃釣石非尋常之石四也東坡自汲非遣卒奴五也大瓢貯月歸春甕小杓分江入夜瓶其狀水之清美極矣分江二字此尤難下雪乳已翻煎處腳松風仍作瀉時聲此倒語也尤為詩家妙法即少陵紅稻啄餘鸚鵡粒碧梧栖老鳳皇枝也枯腸未易禁三碗臥聽山城長短更又翻却盧同公案同喫到七碗坡不禁三碗山城更漏無定長短二字有無窮之味初學詩者須用古人好語或兩字或三字如山谷猩猩毛筆平生幾兩屐身後五車書平生二字出論語身後二字晉張翰云使我有身後名幾兩屐阮孚語五車書莊子言惠施此兩句乃四處合來又春風春雨花經眼江北江南水拍天春風春雨江北江南詩家常用杜云且看欲盡花經眼退之云海氣昏昏水拍天此以四字合三字入口便成詩句不至生梗要誦詩之多擇字之精始乎摘用久而自出肺腑縱橫出沒用亦可不用亦可詩家用古人語而不用其意最為妙法如山谷猩猩毛筆是也猩猩喜著屐故用阮孚事其毛作筆用之抄書故用惠施事二事皆借人以詠物初非猩猩毛筆事也左傳云深山大澤實生龍蛇而山谷中秋月詩用之云寒藤老木被光景深山大澤皆龍蛇周禮考工記車人蓋圜以象天軫方以象地而山谷云丈夫要𢎞毅天地一蓋軫孟子云武成取二三䇿而山谷稱東坡云平生五車書未味二三䇿孔子程子相見傾蓋鄒陽云傾蓋如故孫侔與東坡不識以詩寄東坡和云與君蓋亦不須傾劉寬為吏以蒲為鞭寬厚至矣東坡云有鞭不使安用蒲杜詩云忽憶往時秋井塌古人白骨生蒼苔如何不飲令心哀東坡云何須更待秋井塌見人白骨方銜杯此皆翻案法也余友人安福劉凌闕字景明重陽詩云不用茱萸仔細看管取明年各强健得此法也劉詩雖翻案却不佳宋人好尚多如此五七字絶句最少而最難工雖作者亦難得四句全好者晚唐人與介甫最工於此李義山憂唐之衰云夕陽無限好只是近黃昏如青女素娥俱耐冷月中霜裏鬬嬋娟如芭蕉不展丁香結同向春風各自愁如鶯花啼又笑畢竟是誰春唐人銅雀臺云人生富貴須回首此地豈無歌舞來寄邉衣云寄到玉關應萬里戍人猶在玉關西折楊栁云羌笛何須怨楊栁春光不度玉門關皆佳句也如介甫云更無一片桃花在為問春歸有底忙祇是蛩聲已無夢三更桐葉强知秋百囀黃鸝看不見海棠無數出墻頭暗香一陳東風起知有薔薇澗底花不減唐人然鮮有四句全好者杜牧之云清江漾漾白鷗飛緑净春深好染衣南去北來人自老夕陽長送釣船歸唐人云樹頭樹底覓殘紅一片西飛一片東自是桃花貪結子錯教人恨五更風韓偓云昨夜三更雨臨明一陳寒薔薇花在否側臥捲簾看介甫云水際柴扉一半開小橋分路入青苔背人照影無窮栁隔屋吹香併是梅東坡云暮雲收盡溢清寒銀漢無聲轉玉盤此生此夜不長好明月明年何處看四句皆好矣五言長韻吉詩如白樂天遊悟真寺一百韻真絶唱也五言古詩句雅淡而味深長者陶淵明桞子厚也如少陵羌村後山送內皆有一唱三歎之聲自隆興以來以詩名者林謙之范至能陸務觀尤延之蕭東夫近時後進有張鎡功父趙蕃昌父劉翰武子黃景說岩老徐似道淵子項安世平甫鞏豐仲至姜䕫堯章徐賀恭仲汪經仲權前五人皆有詩集傳世謙之常稱重其友方翥次雲詩云秋明河漢外月近斗牛旁延之有云去年江南荒趂逐過江北江北不可住江南歸未得又寄友人云胸中襞積千般事到得相逢一話無又台州秩滿而歸云送客漸稀城漸逺歸途應減兩三程東夫飲酒云信腳到太古因登嶽陽樓不作蒼茫去真成浪蕩逰三年夜郎客一柂洞庭秋得句鷺飛處看山天盡頭猶嫌未竒絶更上嶽陽樓又荒村三月不肉味併與􅏨茄倚閣休造物於人無補報問天賒得一山秋至能有云月從雪後皆竒夜天到梅邉有别春功父云斷橋斜取路古寺未關門絶似晚唐人詠金林檎花云梨花風骨杏花糚黃薔薇云二語沾滯村學究之體也已從槐借葉更探菊為棠寫物之工如此余歸自金陵送末章云何時重來桂隱軒為我醉到春風前看人喚作詩中仙看人喚作飲中仙此詩超然矣昌父云紅雨連村夜黃風獨徑秋詩窮真得瘦酒薄不禁愁武子云自鋤明月種梅花又云吹入征鴻數字秋淵子云暖分煨芋火明借績麻燈又客路二千年五十向人猶自說歸耕平甫題釣臺醉中偶爾閒伸腳便被劉郎賣得名恭仲云碎砍生柴爛煮詩又有姚宋輔佐一絶句云梅花得月太清生月到梅花越樣明梅月蕭踈兩竒絶有人踏月繞花行僧顯萬亦能詩萬松嶺上一間屋老僧半間雲半間三更雲去作行雨回頭方羡老僧閒又梅詩探支春色墻頭朵䦨入風光竹外梢又河橫星斗三更夜月過梧桐一丈髙又有龎右甫者出使過汴京蒼龍觀闕東風外黃道星連北斗邊月照九衢平似水笛聲吹徹內門前此詩却有餘味吾族前輩諱存字正叟諱朴字元素諱杞字元卿諱輔世字昌英皆能詩元卿年十八第進士其叔正叟賀之云月中丹桂輸先手鏡裏朱顔正後生吾鄉民俗稻未熟摘而蒸之舂以為米其飯絶香元素有詩云和露摘殘雲淺碧帶香炊出玉輕黃余先大中貧嘗作小茅屋三間而未有門扉干元卿求一扉元卿以絶句送門至云三間茅屋獨家村風雨蕭蕭可斷魂舊日相如猶有壁如今無壁更無門昌英有絶句云碧玉寒塘瑩不流紅蕖影裏立沙鷗便當不作南溪看當得西湖十里秋吾州詩人瀘溪先生安福王民瞻名庭圭弱冠貢入京師太學已有詩名有絶句云江水磨銅鏡面寒釣魚人在蓼花灣回頭貪看新月上不覺竹竿流下灘紹興間宰相秦檜力主和戎之議鄉先生胡邦衡名銓時為編修官上書乞斬檜謫新州民瞻送行詩云一封朝上九重關是日清都虎豹閒百辟動容觀奏議幾人回首愧朝班名髙北斗星辰上身落南州瘴海間不待百年公議定漢廷應召賈生還大厦元非一木支要將獨力拄傾危癡兒不了公家事男子要為天下竒當日奸諛皆膽落平生忠義祇心知端能飽喫新州飯在處江山足護持有歐陽永安上飛語告之除名竄辰州孝宗登極召為國子監簿以老請祠除直敷文閣宫觀尤延之嘗誦吳則禮詩華館相望接使星長淮南北已休兵便須買酒催行樂更覓何時是太平滿闕子洞庭柑雪色新裁白苧衫喚得吳姬同一醉春風相送過江南又楓葉蘆花滿釣船水風清處枕琴眠覺來失却瀟湘月却問青山覓酒錢神宗徽猷閣成告廟祝文東坡當筆時黃魯直張文潛朝無咎陳無已畢集觀坡落筆云惟我神考如日在天忽外有白事者坡放筆而出諸人擬續下句皆莫測其意所向頃之坡入再落筆雖光輝無所不充而躔次必有所舍諸人大服潤州火熱盡室廬惟存李衛公塔米元章庵元章喜題塔云神護衛公塔天留米老庵有輕薄子於塔庵二字上添注爺娘二字元章見之大罵輕薄子再於塔庵二字下添注颯糟二字蓋元章母嘗乳哺宫中故云糟字本出漢書霍去病傳云鏖臯蘭山下注云今謂麋爛為鏖糟輕薄子用糟字粘庵字蓋今人讀鏖為庵讀糟為子甘切添注遂成七言兩句云神護衛公爺塔颯天留米老娘庵糟鄉先生劉尚書才邵字美中云劉弇偉明獻南郊大禮賦首句云粵惟古禮豺獺有祭南郊大禮祭天地祖宗而比之豺獺之祭此譬如千乘萬騎羽獵長揚而於其間說鬬蝦蟇劉侍郎岑字季髙居建康中書舍人張孝祥字安國時為帥還往甚密一日安國忽具衣冠造季髙季髙驚異未出先令人問盛服而來何故安國曰欲北面書法季髙不辭讓著道服而出安國則令人扶季髙納再拜者再季髙亦不辭讓安國請曰云云季髙曰云云大意令安國學李雍書徽宗嘗問米某蘇軾書如何對曰畫黃庭堅書如何曰描卿書如何曰刷髙宗初作黃字天下翕然學黃字後作米字天下翕然學米字最後作孫過庭字故孝宗太上皆作孫字韓退之答李錫書云思元賓而不見見元賓之所與者則如元賓焉此用石勒語王浚贈勒麈尾懸之壁間每瞻仰之云王公不得見見王公之玩好如見王公焉退之作河南少尹李素墓銘云髙其上而坎其中以為公之宫奈何乎公此用東方朔諫武帝近董偃云奈何乎陛下退之上宰相書云恤恤乎饑不得食寒不得衣此用左傳語南蒯將叛邑人歌之曰恤恤乎湫乎悠乎又杜兼墓銘云事在於人日逺日忘此用晉書張駿語謂中原之於晉日逺日忘又平淮西碑自皇帝曰光顔汝為陳許帥曰重𦙍云云曰宏云云曰文通云云曰道古云云曰訴云云曰度惟汝豫同汝遂相豫此用舜典命九官文法也栁子厚答韋中立書云抑之欲其奧揚之欲其明疏之欲其通亷之欲其節激而發之欲其清固而存之欲其重此用周禮考工記函人句法云眂其鑽空欲其惌也眂其裏欲其易也眂其眹欲其直也櫜之欲其約也舉而眂之欲其豐也衣之欲其無齘也韓退之行針云宜悔而休汝惡曷瘳宜休而悔汝善安在栁子厚憂針云宜言而言不宜而煩宜退而勇不宜而恐二針相似未知孰先為之者曾子固王無咎字序云以顔子之所以為學者期乎已余之所望於補之也假借乎己而已矣豈豫之所望於補之哉此用孟子句法千里而見王是豫所欲也不遇故去豈豫所欲哉而介甫送陳升之序云堪大臣之事可信而望者陳升之而已矣煦煦然仁而已矣孑孑然義而已矣非豫所望於升之也子固送王希闕序介甫九曜閣記言洪撫兩州山川之盛遊觀之樂亦略相似未知孰先為之者李彌遜知吉州於州學立楊忠襄祠嘗請劉尚書美中作祭文首句云隂虹吐氣暫翳圜景斗於星中孤光耿耿洪河潰溢滔天橫騖屹然中流見此砥柱又云公人中龍那肯屈節於殊方又云欲贖忠襄人百其身彌遜歎服不己不知其用太學生姚孝寧祭李清卿文首句云皇穹將傾天柱必折太華必仆泰嶽必蹶又云公人中龍肯臣殊族又云賊據牀上天子在下公抱帝躬嚼齒大罵公於是時眥裂髮立乾坤盡昏鬼神夜泣又云欲贖清卿人萬其身萬人何多一世猶輕又云吾將提長劍而登泰華抉浮雲而問蒼天雖泣盡而繼之以血安得吾清卿之復然蓋清卿之父避亂於廬陵嘗館於美中之家故美中得此文豫少時當於劉彥純家見其全篇今亡矣可惜廬陵村落地名何山有金地寺壁間有廬陵丞某人留題云今朝憩息來金地何日翺翔到木天觀者歎其的對後美中再入館中唱和云見說木天猶突兀暫時金地亦清閒是時南渡之後駐蹕臨安百司官寺未立暫寓一僧舍為祕書省而汴京本省猶未毀美中此聨朝士歎其親切詩句故難用經語然善用者不勝其韻李師中云夜如何其斗欲落嵗云暮矣天無情又山如仁者靜風似聖之清又詩成白也知無敵花落虞兮可奈何詩有實字而善用之者以實為虛杜云弟子貧原憲諸生老伏虔老字蓋用趙充國請行上老之有用文語為詩句者尤工杜云侍臣雙宋玉戰䇿兩穰苴蓋用六五帝四三王有用法家吏文語為詩句者所謂以俗為雅坡云避謗詩尋醫畏病酒如務如前卷僧顯萬探支䦨入亦此類也庾信月詩云渡河光不濕杜云入河蟾不沒唐人云因過竹院逢僧話又得浮生半日閒坡云殷勤昨夜三更雨又得浮生一日凉杜夢李白月落滿屋梁猶疑照顔色山谷簟詩云落日映江波依稀比顔色退之云如何連曉語祇是說家鄉吕居仁如何今夜雨祇是滴芭蕉此皆用古人句律而不用其句意以故為新奪胎換骨杜蜀山水圖云沱水流中座岷山赴北堂白波吹粉壁青嶂插雕梁此以畫為真也曽造父云斷崖韋偃樹小雨郭熙山此以真為畫也白樂天女道士詩云姑山半峰雪瑶水一枝蓮此以花比美婦人也東坡海棠云朱唇得酒暈生臉翠袖捲紗紅映肉此以美婦人比花也山谷􅙐醿云露溼何郎試湯餅日烘荀令炷爐香此以美丈夫比花也山谷此詩出竒古人所未有然亦是用荷花似六郎之意歐陽作省試知舉得東坡之文驚喜欲取為第一人又疑其門人曽子固之文恐招物議抑為第二坡來謝歐陽問坡所作刑賞忠厚之至論有臯陶曰殺之三堯曰宥之三曰此見何書坡曰事在三國志孔融傳注歐退而閲之無有他日再問坡坡曰曹操滅袁紹以袁熙妻賜其子丕孔融曰昔武王伐紂以妲己賜周公操驚問見何經融曰以今日之事觀之意其如此堯臯陶之事某亦意其如此歐退而大驚曰此人可謂善讀書善用書他日文章必獨步天下余嘗思之禮記云獄成有司告於王王宥之有司曰在辟王又曰宥之有司又曰在辟王三宥不對走出致刑於甸人坡雖用孔融意然亦用禮記故事其稱王謂王王皆然安知此典故不出於堯客有自秦少遊處來見東坡坡問少遊近有何好句客舉秦燕子樓詞云小樓連苑橫空下臨繡轂雕鞍驟坡笑曰又連苑又橫空又繡轂又雕鞍又驟也勞攘軾亦有此詞云燕子樓中佳人何在空有樓中燕東坡談笑善謔過潤州太守髙㑹以饗之飲散諸妓歌魯直茶詞云惟有一杯春草解留連佳客坡正色曰却留我喫草諸妓立東坡後慿東坡胡牀者大笑絶倒胡牀遂折東坡墮地賓主一笑而散見蜀人李圭說東坡知徐州李定之子某過焉坡以過客故事宴之其人大喜以為坡愛敬之也因起而求薦墨坡陽應之曰諾久之閒談坡忽問李相云面上人中長一寸者夀百年有是說否李曰未聞也坡曰果若人言彭祖好一箇呆長臉李大慚而遁見王僑卿說東坡嘗宴客俳優者作伎萬方終不笑一優突出用捧痛打作技者曰內翰不笑汝猶稱良優乎對曰非不笑也不笑者乃所以深笑之也坡遂大笑蓋優人用東坡王者不治夷狄非不治也不治者乃所以深治之也見子由五世孫奉新縣尉懋說豫過金山見妙髙臺上掛東坡像有坡親筆自贊云目若新生之犢身如不繫之舟試問平生功業黃州惠州崖州今集中無之豫昔為零陵丞嘗肩輿過一野寺前壁間山谷親筆一詩豫小立肩輿誦之三過既歸書之止記一聨云春將國艷薰花骨日借黃金縷水紋今集中亦無之蔡攸幼慧其叔父卞荆公壻也卞㩦攸見公一日公與客論及字說攸立其膝下回首問曰不知相公所解之字為復是解倉頡為復是解李斯字公不能答拊其頂曰你無良你無良見劉尚書美中說東坡赤壁賦云扣舷而歌之歌曰云云客有吹洞簫者倚歌而和之其聲嗚嗚然如怨如慕山谷為坡寫此賦為圖障云扣舷而歌曰又其聲嗚嗚如怨如慕去之歌然三字覺神觀精鋭孫仲益作上梁文云老蟾駕月上千岩紫翠之間一鳥呼風嘯萬木丹青之表周茂振曰既呼又嘯易嘯為響本朝制誥表啓用四六自熙豐至今此文愈盛有一聨用兩處古人全語而雅馴妥帖如已出者介甫賀冊后妃表關睢之求淑女無險陂私謁之心雞鳴之思賢妃有警戒相成之道紹興間劉美中除工部侍郎兼直學士院吉水丞龔尹字正子以啓賀之技巧工拙精其能自元成之間鮮能及號令文章煥可述雖詩書所稱何以加尹又上湯丞相啓云生民以來未有盛於夫子天下之士豈復賢於周公後二語用韓退之上宰相書中書舍人張安國知撫州自撫移蘇謝上表云雖自西徂東周爰執事然以小易大是誠何心增雖然二字而兩州東西大小乃甚的切王履道賀唐祕校及第啓云得知千嵗上賴古書作吏一行便廢此事前二語用淵明詩得知千載外正賴古人書翦去兩字後二句用嵇康書一行作吏此事便廢而皆倒易二字東坡答士人啓云愧無琴瑟旨酒以樂我嘉賓所喜直諒多聞真古之益友此雖增損五六字而特圜美至翟公巽行麻制云古我先王惟圖任舊人共政咸有一德克左右厥辟宅師則前二語熟而後二語突兀矣四六有一聨而用四處古人語者張欽夫答一教官啓云識其大者豈誦說云乎哉何以告之曰仁義而已矣四人語乃如一人語王履道行余深少宰制云仰惟前代守文為難相我受民非賢不乂其意亦貫四六有作流麗語者亦須典而不浮東坡謝知湖州表云湖山如舊魚鳥亦怪其衰殘謝知密州云賓出日於麗譙江山炳煥傳夕烽於海嶠鼓角清閒謝賜笏帶云草木何知被慶雲之渥彩魚蝦至賤借滄海之榮光雖曰可觀終非其有汪彥章賀神降萬嵗山表云恍若壺天金成宫闕浩如玉海虹貫山川此皆典而不浮孫仲益亦多此等語至橘林則浮靡而不典笑四六有作華潤語而重大者最不可得韓退之表云地彌天區界軼海外北嶽醫閭神鬼受職析木天衢星宿清潤曽子固云鈎陳太微星緯咸若崑崙渤澥波濤不驚王履道行种師道麻制云封疆開崑崙積石之西威譽震大漠龍荒之北四六有用古人全語而全不用其意者行葦之詩云仁及草木牛羊勿踐履此盛世之事也又鴟梟之詩云曰豫未有室家風雨所漂搖謂鴟梟愛巢也王履道北人也靖康避亂遷謫在八桂思鄉里墳墓作青詞云萬里丘墳草木牛羊之踐履百年鄉社室家風雨之漂搖有客在張敬夫座上舉介甫賀册后妃關睢雞鳴之聨以為四六之妙者敬夫因舉東坡賀册后表云上符天造日月為之光明下逮海隅夫婦無有愁歎曰此全不用古人一字而氣象塞乎天地矣紹興間金人歸我河南地洪景伯賀表云宣王復文武之土可謂中興齊人歸鄆歡之田不失舊物屬聨有工夫然去一境字便覺難讀用古人語有用其字之聲而不用其字之形者書曰人惟求舊而介甫謝上表云仁惟求舊義不遐遺乃易人為仁莊子曰副墨之子聞之洛誦之孫副墨謂文墨之有副本者洛誦謂洛人之善誦讀者而介甫賀皇子表前一聨言成王文王子衆多而繼之以恭惟皇帝陛下令德光乎洛誦康功茂乎岐昌則以洛誦為成王矣蓋成王名誦而卜洛故也此文人之舞文弄法者也四六有截斷古文語五字而補以一字如天成者有用古人語不易其字之形而易其意者漢書云在漢廷無出其右論語云與文子同升諸公而翟公巽賀蔡攸除少師啓云朝廷無出其右父子同升諸公既截斷其語而補以一字讀者不覺其補而又易文子為父子子之字雖同而文子乃人名父子非人名也此巧之至也子牟身居江湖之上公治雖在縲絏之中而東坡謝罪表云身居江湖之上夢逰縲絏之中孟子曰此之謂失其本心左傳曰吾必使汝罷於奔命翟公巽一年之中移作數郡太守謝表云憂患失其本心筋骨罷於奔命亦此類也中書舍人洪景盧知婺州召至都下而從臣未有虛位孝宗除為在京宫觀兼侍讀太府少卿張抑字子儀以啓賀之云珍臺閒館冠臯伊之倫魁廣厦細旃論唐虞之聖道前兩句用揚雄賦全語後兩句用王吉疏全語皆西漢文章也子儀舉似豫豫驚歎擊節以為不減前輩未幾景盧入翰林為學士適梁叔子丞相以病辭位孝宗愛重之不聽其去纍辭不得已拜大觀文醴泉觀使兼侍讀景盧當筆麻制中全用此一聨是日朝士聽麻者皆稱賞之不知其為子儀語也四六有初語平平而去其一字精神百倍妙語超絶者介甫賀韓魏公致仕啓云言天下之所未嘗任大臣之所不敢其初句尾有言任二字而去之也循王張浚妾封夫人中書舍人程子山行詞以異姓王對如夫人朝士稱之靖康遣聶山割三鎮與金人請和三鎮之民不肯左衽羣起毆山至死而朝廷或傳其生詞臣行加恩詞云風寒易水知士去之不還日逺長安怪人來而未至汪伯彥黃潛善為相時太學之士陳東以上書誅既而髙宗深悔之贈東諫議大夫而罷汪黃二相後趙鼎為相汪黃有啓謝廟堂鄱陽熊彥時叔雅為趙客代趙答啓云一男子之上書彼將焉罪諸大夫曰可殺公亦何心靖康二聖北狩皇屬畢遷中原無主惟髙宗皇帝在外獨免隆祐太后以書勸進有云獻公之子九人惟重耳之尚在漢家之厄十世宜光武之中興此汪彥章詞也建炎苗劉之禍未幾復辟赦書云斷鰲而立四極既成開闢之勳取日而授五龍復正神明之御此李漢老辭也張邦昌既僣竊竄謫謝髙宗表云孔子從佛肸之召蓋欲興周紀信乘漢王之車固將誑楚其黨顔博文之詞也邦昌初立時博文首上賀表云非湯武之干戈同堯舜之禪讓其反覆如此李綱罷相被謫汪彥章行詞云朋奸罔上有虞必去於歡兜欺世盜名孔子首誅於正卯又云專殺尚威傷列聖好生之德信讒喜佞為一時羣小之宗客有問彥章者曰內翰頃有啓賀伯紀拜相云孤忠貫日正二儀傾側之中凛氣橫秋揮萬騎笑談之頃又云士訟公寃咸舉蟠而集闕下君從民望令免胄以見國人與今謫詞一何反也彥章曰某此啓自直一翰林學士渠不我用故以後詞報之又曰乃傾家積隂與賊通若行此言何從知得答曰某如何知得但見渠兒子自敵中歸汪彥章初除北門有小官賀以啓云當年翰苑曽聞學士之葫蘆今日玉堂又見司空之蘿蔔自以為竒有問之者曰葫蘆事得非用太祖皇帝嘲內翰陶穀所謂年年依樣畫葫蘆者曰然又問蘿蔔何出曰昔司空圖在翰苑嘗作蘿蔔詩聞者絶倒又吾州安福有歐陽寺丞叔向者嘗為妻病作青詞云大小二便半月未通於水火晨昏兩膳一粒不過於咽喉又近有代京丞相作遺表者首句云身獨立於上台未踰三月瘡忽生於下體幾及半年莆田陳丞相作小朝士時顯仁太后之喪嘗代宰相乞皇帝御殿表云雖天道何言四時自然成嵗太陽不照萬物何以仰瞻識者已知其有宰相器公後為左相辭位其客鄭僑惠叔代作表云責任匪輕此豈允居之地從容求去幸當未厭之時豈允居牛僧孺語也幸未厭蕭嵩語也皆宰相求去事未有如此親切者梁丞相叔子生日孝宗賜酒物是時梁母太夫人在尤延之代作謝表云小人有母雖喜君羮之嘗大烹養賢每虞公餗之覆黃仲秉攝西掖行東坡贈太師諡文忠詞云朕考百年治亂之原識諸老忠邪之辨惟小人無所忌憚使君子至於困窮又某目無全牛意空凡馬道不行而言立身愈退而名髙又云言之尚至於歎嗟聞者亦為之興起户部侍郎史正志自請為諸路發運使遍行州縣凡合起上供及江上餉師錢穀盡以為羡餘而獻之壽皇大喜既而嵗暮上供無一州至者版曹大窘奏其事上大怒即日罷默仲秉行詞有云多取贏於郡國無遺算於雞豚校數嵗之中以為常本無心計無三年之畜曰不足徒有口才及仲秉為刑部侍郎觸一權貴丐外得丹陽謝廟堂啓云一麾江海頗欲避西風之塵兩鬢雪霜但堪飲北府之酒王季海丞相為太常少卿時葛丞相楚補為浙東參議官以啓賀季海用雞檄對鵝經季海賞其的對雞檄乃用王勃為諸王作鬬雞檄山谷戲筆尚書范文正公為舉子時作虀賦有云陶家甕內淹成碧緑青黃措大口中嚼出宫商徵羽吾觀劉沆丞相微時讀書山寺寺僧請公戲作偷狗賦有云摶飯引來喜掉續貂之尾索綯牽去驚回顧兔之頭常州人諱打爺蓋常有子為卒伍而其父坐罪當杖者其子恐他人杖其父之重而身請行刑故有此譏士人有戲作此賦者云當年祖逖見而知聞而知後日孫權出乎爾反乎爾投人詩文有語忌者不可不知人有上文潞公詩用夀考字公曰五曰考終命和我死也說了程子山自中書舍人謫為戅州安逺令士子上生日詩用嶽降事子山曰降做縣令了更去甚處周茂振賀劉季髙由謫籍放自便啓云十年去國驚我馬之虺隤一日還家喜是翁之矍鑠季髙曰是翁却將對我馬此類多矣至如紹興間張叔夜之子常先為江西常平使者有小官上啓其自叙處云叔夜粗踈次山孟浪常先大怒曰我爺何曽粗疏雖常先不學可笑然小官亦當問上官家諱吉州推官李椿嘗干一上官言舉狀而上官家諱有復名而一字椿者初許薦而後不與請豫族弟炎正字濟翁作一啓以解之云諱名不諱姓雖存羊棗之遺文言在不稱徵亦有杏壇之故事上官遂舉之濟翁年五十二乃登第初任寧逺簿甚為京丞相所知有啓上丞相云秋驚一葉感蒲栁之先知春到千花歎桑麻之後長丞相遂厚待除掌故之令尤延之嘗舉前輩四六有云秉圭執璧禮天地之神祇潔粢豐盛報祖宗之功德謂其不造語而體面大又嘗愛子由行詞有云養德丘園本無求於當世書名史策恍若疑其古人詩曰燕及皇天又曰誕彌厥月而介甫賀進築熙河表云旌旃所指燕及氐羌樓櫓相望誕彌河隴淵明子美無已三人作九日詩大槩相似子美云竹葉於人既無分菊花從此不須開淵明所謂塵爵恥虛罍寒華徒自榮也無已云人事自生今日意寒花祇作去年香此淵明所謂日月依辰至舉俗愛其名也介甫當國喜言農田水利有獻議梁山濼可涸之以為田介甫欲行之又念水無所歸以問劉貢父曰此事楊蟠無齒貢父退介甫思其說而不得呼其子雱問以此語何意且出何書雱曰不知當召而問之貢父既至雱以父之語問焉貢父笑曰此易曉耳楊蟠杭人善作詩自號浩然居士相公熟識之今欲涸湖為田此事浩然無涯也一時聞者絶倒東坡詩云臥占寬閒五百弓汪彥章啓云嗟甫里百弓之别墅七尺二寸為一弓事見譯梵一尺八寸為一肘四肘為一弓今通鑑二百四十八卷㑹昌五年祠部奏天下寺四千六百蘭若四萬注下亦詳史照釋丈引薩汲多論云西天度地以四肘為一弓去寺舍五百弓不逺不近以閒靜處為蘭若若今以唐尺計之蓋二里許也或問何謂雙聲叠韻曰行穿詰曲﨑嶇路又聽鈎輈格磔聲上句叠韻下句雙聲也何謂蜂腰鶴膝曰詞源倒流三峽水筆陳獨掃千人軍無邊落木蕭蕭下不盡長江滚滚來前一聨蜂腰後一聨鶴膝也近世蜀人多妙於四六如程子山趙莊叔劉韶美黃仲秉其選也然未免作意為之者張敬夫深於經學初不作意於文字間而每下筆必造極紹興辛已年其父魏公久謫居永州得旨自便敬夫代作謝表自叙有云家國異謀固難調於衆口天日下照夫何歉於一心兹蓋伏遇皇帝陛下體堯之仁行禹之智微彰以道必因天地之時動化若神孰測風雷之用其詞平其味永其韻孤豈作意為之者時年二十九李方叔之孫大方字久蹈少時嘗作思故山賦諸公稱之以為似邢居實晚得一鶡冠今為雜買場寄豫詩一篇多有警句如二百年來今已秋天地自老江自流如笛聲吹起白玉槃正照御前楊栁碧如可憐一代經綸業不扺鍾山幾首詩如後院落花人不到黃鸝飛下石榴隂大似唐人附録御史黃公之詩如聞新鴈一聲初觸夢半白已侵頭餘燈依古壁片月下滄州如逰東林寺闕寒三伏雨松偃數朝枝如上李補闕諫草封山藥朝衣施衲僧如退居青山寒帶雨古木夜啼猿此與韓致光吳融輩未知孰為先後按唐藝文志御史黃滔字文江光啓中為四門博士其集舊曰黃滔集云豫嘗愛隂鏗梅詩云花舒雪尚飄照日不俱消蘇子卿云祇言花是雪不悟有香來唐人崔道融云香中别有韻清極不知寒淵明九日閒居詩云塵爵恥虛罍寒花徒自榮東坡和云鮮鮮霜菊豔溜溜糟牀聲西溪和云境靜人亦寂觴至壺自傾西溪劉氏諱承弼字彥純嘗再與計偕報聞歸隱於安福之面溪豫少作有詩千餘萹至紹興壬午七月皆焚之豫嘗舉舊詩數聨於友人尤延之如露巢蛛恤緯風語燕懷春如立岸風大壯還舟燈小明踈星煜煜沙貫日緑雲擾擾水舞苔坐忘日月三杯酒臥護江湖一釣船延之慨然曰焚之可惜豫亦無甚悔也雪巢小集天台林憲景思之詩也至如桃花飛後楊花飛楊花飛後無花飛天空霜無影等句超出詩人準繩之外李兼孟達出唐人詩一編乃其入世推官公披沙集如見後却無語别來長獨愁如危城三面水古樹一邊春如月明千嶠雪灘急五更風如煙殘偏有焰雪甚却無聲如春雨有五色灑來花簇成如雲藏山色晴還媚風約溪聲靜又回如未醉已知醒後恱欲開先為落時愁皆佳杜必簡之詩其競已甚又得少陵以為之孫遂建大將鼓旗以出獨主百世詩人之夏盟今觀必簡之詩若牽風紫蔓長即水荇牽風翠帶長之句也若鶴子曵童衣即儒衣山鳥怪之句也若雲隂送晚雷即雷聲忽送千峰雨之句也若風光新栁報宴賞落花催即星霜去鳥變身世白駒催之句也至於往來花不發新舊雪仍殘如日氣殘虹薄如愁思看春不當春明年春色倍還人如飛花攪獨愁皆佳句也三世之後大莫與京也宜哉晚唐諸子詩寄邊衣曰寄到玉關應萬里戍人猶在玉關西弔戰場曰可憐無定河邊骨猶是春閨夢裏人折楊栁曰羌笛何須怨楊栁春光不度玉門關三百篇之遺味暗然猶存也四明劉叔向寄其父頤庵居士之詩稿偶披卷讀至云寂寞愁弔影雲窗怕上短檠燈又燭與梅花共過冬淡月故移踈影去又睡魔正與詩魔戰窗外一聲婆餅焦又早行云雞犬未鳴潮半落草蟲聲在豆花村不減晚唐居士名應時字良佐王正夫之詩如落木森猶力寒山淡欲無如地迥髙樓目天寒故國心如涼風回逺笛暝色帶歸舟如塵心依水淨歸鬢與山青不減晚唐諸子矣如墮蕊盡應輸燕子懶寒猶及占梨花如一畨風雨催寒食千里鶯花想故園如身閒更得慿陵酒花早殊非愛惜春如秋生列岫雲尤薄泉潄懸崖路更慳置之江西社中何辨焉北窗先生鄒公和仲詩祖山谷記其誦所作如久霖云勸雷且臥鼓如讀人詩卷云聲名藹作紫蘭護詩闕誠齊詩話
